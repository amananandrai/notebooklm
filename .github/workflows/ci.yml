name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build

  api:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python tests/test_security.py
      - run: python tests/test_concurrency.py
      - run: python tests/test_server_config.py
      - run: python tests/test_api.py

  e2e:
    name: Browser end-to-end
    runs-on: ubuntu-latest
    needs: [web, api]
    env:
      E2E_ACCESS_KEY: ci-e2e-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: npm install --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start stub API and preview server
        run: |
          python tests/e2e/stub_server.py 8080 > stub.log 2>&1 &
          npx vite preview --port 5173 --strictPort > preview.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health >/dev/null && curl -sf http://localhost:5173 >/dev/null && break; sleep 1; done
      - run: node tests/e2e/smoke.cjs
      - if: failure()
        run: tail -50 stub.log preview.log
